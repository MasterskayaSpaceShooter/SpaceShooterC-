name: Code Style Check

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  clang-format:
    name: Check code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify .clang-format exists
        run: test -f .clang-format || (echo "::error ::.clang-format not found" && exit 1)

      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8

      - name: Show clang-format version
        run: clang-format --version

      - name: Check formatting
        run: |
          find . \
          -path './.git' -prune -o \
          -path './build' -prune -o \
          -path './cmake-build-*' -prune -o \
          -type f \( \
          -name '*.cpp' -o \
          -name '*.hpp' -o \
          -name '*.cc' -o \
          -name '*.cxx' -o \
          -name '*.h' -o \
          -name '*.c' \
          \) \
          -exec clang-format --dry-run --Werror --style=file {} +
