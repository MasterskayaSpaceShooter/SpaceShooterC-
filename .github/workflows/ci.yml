name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: pipx install "conan>=2,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Conan install
        run: conan install . -s build_type=Release -s compiler.cppstd=20 -b missing

      - name: Configure
        run: cmake --preset release-default

      - name: Build
        run: cmake --build --preset release-release

      - name: Test
        run: ctest --preset release-release --output-on-failure
